# ReleaseRadar — target apps
# Category: UPI payments (India)
# IDs verified against the Play Store on 2026-09-17.

apps:
  phonepe:
    id: com.phonepe.app
    display: PhonePe
    focus: true          # primary app for release-impact & early-warning deep dives
    downloads_verified: "500M+"
    rating_verified: 4.4
    reviews_verified: "14.2M"

  gpay:
    id: com.google.android.apps.nbu.paisa.user
    display: Google Pay
    focus: false
    downloads_verified: "1B+"
    rating_verified: 4.3
    reviews_verified: "11.4M"

  paytm:
    id: net.one97.paytm
    display: Paytm
    focus: false
    downloads_verified: "500M+"
    rating_verified: 4.7
    reviews_verified: "24.2M"

scrape:
  lang: en
  country: in
  batch_size: 200
  sleep_seconds: 0.3
  # Safety ceiling only — in practice the Play Store's own pagination
  # exhausts well before this for a high-volume app (PhonePe hit a
  # natural empty-batch stop at 93,200 reviews / ~5.6 months of history
  # during the Phase 1 depth test on 2026-09-17). See decision_log.md.
  max_reviews_per_app: 150000
  # Seconds to pause between apps, to reduce the chance that sustained
  # scraping of one app rate-limits the next request.
  inter_app_cooldown_seconds: 60

version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: reviews
        description: >
          Raw scraped Play Store reviews, one row per review, loaded by
          src/load/load_raw.py from parquet files written by
          src/scrape/scrape_reviews.py. Not deduplicated -- a review may
          appear more than once across weekly re-scrapes; dedup happens
          in stg_reviews.
      - name: review_topics
        description: >
          Long format (one row per review-topic pair) output of the
          Phase 4 multi-label topic classifier
          (src/classify/apply_classifier_to_corpus.py), applied to every
          review in stg_reviews. Macro-F1 0.556 on a 450-review held-out
          test set (see decision_log.md, 2026-09-18) -- per-topic
          reliability varies significantly; treat low-F1 topics
          (login_otp_kyc, ads_spam, investments_gold) as directional.
      - name: review_flags
        description: >
          churn_intent prediction from a dedicated binary classifier
          (src/classify/apply_churn_to_corpus.py). Recall 0.615,
          precision 0.178 on the held-out test set -- tuned to favor
          recall (catch more true churn signals at the cost of false
          positives) rather than precision. competitor_mentioned is
          handled separately in Phase 7, not here.
      - name: release_impact
        description: >
          Output of the Phase 5 competitor-controlled DiD + placebo-test
          analysis (src/analysis/release_impact.py), one row per PhonePe
          version tracked in int_version_adoption. See decision_log.md
          (2026-09-18) -- of 12 usable releases, none are significant
          after Benjamini-Hochberg correction (q<0.10); the strongest
          candidate (q=0.12) turned out to be a parallel-trends
          violation on inspection, not a genuine release effect.
      - name: alerts
        description: >
          Merged alert events from the Phase 6 early-warning detector
          (Poisson + robust z-score on N-hour bins, per-app bin width
          from the Phase 4 data-sufficiency decision: PhonePe 1h,
          Google Pay/Paytm 3h). One row per merged episode.
      - name: switching_matrix
        description: >
          Phase 7 brand-switching flows (source app -> dest app), with
          per-10k-reviews rates and bootstrap 95% CIs where the source
          is a tracked app. See decision_log.md -- rule-based relation
          classifier, precision ~85-95% but recall has real gaps
          (Hindi/Hinglish comparisons and several English phrasing
          variants are under-detected), so counts are a LOWER BOUND.
      - name: review_relations
        description: >
          One row per (review, other_app_mentioned) with the classified
          relation (switching_away / switched_from_competitor /
          comparison_only / none). See switching_matrix description
          for validation caveats.
      - name: issue_backlog
        description: >
          Phase 8 RICE-ranked issue backlog: rating-penalty regression,
          Issue Cost Index, and RICE score per (app, topic), with
          Monte Carlo top-3 stability under +/-50% effort uncertainty.
          Reach uses Play Store download counts as a proxy for MAU
          (see decision_log.md, 2026-09-19) -- valid for within-app
          ranking, not for comparing RICE scores across apps.
          `ui_ux` has a positive rating-penalty coefficient (co-occurs
          with praise, not pure complaints) and needs manual
          interpretation rather than trusting the automated score.
      - name: incidents
        description: >
          Confirmed, independently-sourced UPI outage incidents used as
          ground truth. Only 1 row -- see decision_log.md (2026-09-18):
          extensive research found most well-documented outages predate
          every app's data collection window; this is the one that
          both falls in-window and has 4 independent sources.
